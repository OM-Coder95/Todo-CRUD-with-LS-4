<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo CRUD Application</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12 mx-auto mt-5 mb-4 heading">
                <h1>Todo CRUD</h1>
                <P>Add, Edit, Delete and Manage your tasks</P>
            </div>

            <div class="col-md-12 ">
                <div class="card todoCard">
                    <div class="card-body todoBody">

                        <div class="d-flex sectionHeading">
                            <i class="fa-solid fa-file-circle-plus fa-2x text-primary"></i>
                            <h3>Add New Todo</h3>
                        </div>

                        <form id="form">
                            <div class="form-group row">

                                <div class="col-md-4">
                                    <label for="taskName">Task Name</label>
                                    <input type="text" class="form-control" id="taskName"
                                        placeholder="Enter task name...">
                                </div>

                                <div class="col-md-4">
                                    <label for="priority">Priority</label>
                                    <select id="priority" class="form-control">
                                        <option value="selectPriority" disabled selected>Select Priority</option>
                                        <option value="High">High</option>
                                        <option value="Medium">Medium</option>
                                        <option value="Low">Low</option>
                                    </select>
                                </div>

                                <div class="col-md-4 d-flex align-items-end justify-content-between">
                                    <button type="submit" class="btn btn-sm btn-primary submitBtn" id="submitBtn"><i
                                            class="fa-solid fa-plus"></i>Add
                                        Todo</button>
                                    <button type="button" class="btn btn-sm btn-primary updateBtn" id="updateBtn"><i
                                            class="fa-regular fa-pen-to-square "></i>Update Todo</button>
                                </div>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
            <div class="col-md-12 mt-4">
                <div class="card todoCard">
                    <div class="card-body todoBody">

                        <div class="d-flex justify-content-between">
                            <div class="d-flex sectionHeading">
                                <i class="fa-solid fa-table-list fa-2x text-primary"></i>
                                <h3>Todo List</h3>
                            </div>
                            <div>
                                <button class="btn btn-sm text-danger deleteAll"><i
                                        class="fa-solid fa-trash fa-2x text-danger "></i>Delete All</button>
                            </div>
                        </div>

                        <!-- table -->
                        <table class="table table-bordered text-center todoTable">
                            <thead>
                                <tr>
                                    <th>Sr. No.</th>
                                    <th>Task Name</th>
                                    <th>Priority</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="todocontainer">
                                <tr>
                                    <td>1</td>
                                    <td>go to gym</td>
                                    <td>high</td>
                                    <td>
                                        <i class="fa-regular fa-pen-to-square fa-2x text-primary"></i>
                                        <i class="fa-solid fa-trash-can fa-2x text-danger"></i>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>




    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
